<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install MKSAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: #1e293b; border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .icon { width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
    .install-btn { display: inline-block; background: #3b82f6; color: white; font-size: 18px; font-weight: 600; padding: 16px 48px; border-radius: 14px; text-decoration: none; transition: background 0.2s; width: 100%; }
    .install-btn:active { background: #2563eb; }
    .install-btn.disabled { background: #334155; color: #64748b; pointer-events: none; }
    .note { color: #64748b; font-size: 13px; margin-top: 20px; line-height: 1.5; }
    .status { font-size: 13px; margin-top: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📚</div>
    <h1>MKSAP 19</h1>
    <p class="subtitle">Open this page on your iPhone in Safari, then tap Install.</p>
    <a class="install-btn disabled" id="install-link" href="#">Install App</a>
    <div class="status" id="status">Loading...</div>
    <p class="note">Requires iOS 16+. Must be opened in Safari — Chrome and Firefox will not work.</p>
  </div>
  <script>
    fetch('manifest.plist?' + Date.now())
      .then(r => { if (!r.ok) throw new Error('no build'); return r.text(); })
      .then(() => {
        var base = window.location.href.replace(/index\.html.*$/, '').replace(/\?.*$/, '');
        if (!base.endsWith('/')) base += '/';
        var url = encodeURIComponent(base + 'manifest.plist');
        var btn = document.getElementById('install-link');
        btn.href = 'itms-services://?action=download-manifest&url=' + url;
        btn.classList.remove('disabled');
        btn.textContent = 'Install App';
        document.getElementById('status').textContent = 'Tap to install';
      })
      .catch(() => {
        document.getElementById('status').textContent = 'No build available yet — check back after the first CI run.';
      });
  </script>
</body>
</html>
